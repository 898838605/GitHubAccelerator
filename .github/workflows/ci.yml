name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pystray ruff pyinstaller

      - name: Lint (ruff)
        run: ruff check .

      - name: Build exe
        run: pyinstaller --noconfirm GitHubHostsAccelerator.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHubHostsAccelerator
          path: dist/GitHubHostsAccelerator.exe
