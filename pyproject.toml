[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-hosts-accelerator"
version = "5.1.5"
description = "Windows 桌面工具：把 GitHub 域名指向实测最优 IP 写入系统 hosts，加速 GitHub 访问"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=10,<12",
    "pystray>=0.19,<0.20",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.6",
]

[tool.setuptools]
packages = ["core", "ui", "utils"]
py-modules = ["main"]

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = ["build", "dist", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
